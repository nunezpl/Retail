<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Log In</title>
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
  <div class="container">
    <div class="form-section">
      <h1>Log in</h1>

      <!-- Mostrar mensaje de error si existe -->
      <p th:if="${error}" th:text="${error}" style="color:red; font-weight:bold;"></p>

      <form th:action="@{/api/cliente/login}" method="post">
        <input type="email" name="correo" placeholder="example.email@gmail.com" required>
        <input type="password" name="contrasena" placeholder="Enter at least 8+ characters" required>

        <div class="form-extra">
          <label><input type="checkbox"> Remember me</label>
          <a th:href="@{/forgot-password}">Forgot password?</a>
        </div>

        <button type="submit" class="btn fill">Sign in</button>
      </form>

      <p class="divider">Or sign in with</p>
      <div class="social-icons">
        <button class="social google">G</button>
        <button class="social facebook">f</button>
        <button class="social apple"></button>
      </div>
    </div>

    <div class="image-section">
      <img th:src="@{/img/create_account.png}" alt="Illustration">
    </div>
  </div>
</body>
</html>
